# Local run: PostgreSQL + the app. The app emulates AWS WAF (WAF_MODE=emulated).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-qgadmin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
      POSTGRES_DB: queryguard
    # Same logging idea as the RDS parameter group: statements that fail
    # (typical of injection probing) are written to the log.
    command: ["postgres", "-c", "log_min_error_statement=error", "-c", "log_connections=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d queryguard"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./app
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: queryguard
      DB_SSLMODE: disable
    ports:
      - "8000:8000"
    # Serve the frontend straight from the source tree, so page edits show
    # on reload without rebuilding the image.
    volumes:
      - ./app/static:/srv/static:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
